[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goae-lookup"
version = "0.1.0"
description = "Context-minimal, agent-agnostic lookup of German GOÄ fee codes (CLI + MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
goae = "goae.__main__:main"

[tool.setuptools]
packages = ["goae"]
